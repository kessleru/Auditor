<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Auditoria RF — acessibilidade e usabilidade dos portais da Rede Federal">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F4FA8"/>
      <stop offset="100%" stop-color="#0F2C66"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.1" cy="0.05" r="0.7">
      <stop offset="0%" stop-color="#2A62C9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2A62C9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#fundo)"/>
  <rect width="1280" height="360" fill="url(#brilho)"/>

  <!-- Marca: o "A" cuja barra horizontal é um sinal de verificação, dentro do anel do foco. -->
  <g transform="translate(104 106)">
    <rect x="0" y="0" width="140" height="140" rx="30" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="7" y="7" width="126" height="126" rx="24" fill="none" stroke="#9FC2FF" stroke-width="3.5"/>
    <path d="M44 104 L70 40 L96 104" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M53 83 L65 95 L88 67" fill="none" stroke="#7FE0B6" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <text x="300" y="164" font-size="64" font-weight="600" fill="#FFFFFF" letter-spacing="-1.2">
      Auditoria <tspan fill="#9FC2FF">RF</tspan>
    </text>
    <text x="302" y="212" font-size="24" fill="#DCE6F9">
      Acessibilidade e usabilidade nos portais da Rede Federal
    </text>

    <line x1="302" y1="246" x2="382" y2="246" stroke="#9FC2FF" stroke-width="3" stroke-linecap="round"/>

    <text x="302" y="288" font-size="19" fill="#AFC6EC" letter-spacing="0.3">
      varredura com axe-core
      <tspan dx="26" fill="#6E8DC4">/</tspan>
      <tspan dx="26">inspeção heurística</tspan>
      <tspan dx="26" fill="#6E8DC4">/</tspan>
      <tspan dx="26">dados abertos</tspan>
    </text>
  </g>

  <!-- Medidor de conformidade: o número que o sistema publica. -->
  <g transform="translate(1110 180)" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <circle r="78" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="12"/>
    <circle r="78" fill="none" stroke="#7FE0B6" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="382 490" transform="rotate(-90)"/>
    <text y="0" text-anchor="middle" font-size="42" font-weight="600" fill="#FFFFFF">78%</text>
    <text y="30" text-anchor="middle" font-size="17" fill="#AFC6EC">conformidade</text>
  </g>
</svg>
