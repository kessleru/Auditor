name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  qualidade:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Ponta a ponta e dogfooding
    runs-on: ubuntu-latest
    needs: qualidade
    env:
      # Conta usada só pelos testes; o banco é criado do zero a cada execução.
      E2E_AUDITOR_EMAIL: auditora@exemplo.test
      E2E_AUDITOR_PASSWORD: senha-de-teste-do-ci-2026
      CRAWLER_CONTACT_EMAIL: ci@exemplo.test
      WEB_ORIGIN: http://localhost:4173
      DATABASE_PATH: ./data/ci.sqlite
      SNAPSHOTS_DIR: ./data/snapshots
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # A versão do Chromium acompanha a do playwright fixada no package.json (seção 3.2.4).
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: Preparar o banco e a conta de teste
        run: |
          npm run db:migrate
          npm run db:seed
          printf '%s\n' "$E2E_AUDITOR_PASSWORD" | npm run create-auditor -- \
            --email "$E2E_AUDITOR_EMAIL" --name "Auditora do CI"

      - name: Subir a API
        run: |
          node apps/api/dist/server.js &
          npx wait-on http://localhost:3333/api/v1/health --timeout 60000

      - name: Testes de ponta a ponta
        run: npm run test:e2e

      # Dogfooding: o motor deste projeto audita o próprio front; achado crítico derruba o build.
      - name: Auditar o próprio front
        run: |
          npm run preview -w @auditoria-rf/web -- --port 4173 --strictPort &
          npx wait-on http://localhost:4173 --timeout 60000
          npm run dogfood -- --base http://localhost:4173

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
