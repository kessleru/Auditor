# Cabeçalhos de segurança do front (incluído em cada location do nginx.conf que serve arquivos).
# O front não tem script inline nem recurso de terceiros: fontes vêm empacotadas no build e a API
# responde na mesma origem. `style-src 'unsafe-inline'` cobre o atributo style do React (larguras
# das barras de conformidade, por exemplo).
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
