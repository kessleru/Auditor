services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - '3333:3333'
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      API_PORT: '3333'
      DATABASE_PATH: /app/data/auditoria.sqlite
      SNAPSHOTS_DIR: /app/data/snapshots
    volumes:
      - ../data:/app/data
    restart: unless-stopped
