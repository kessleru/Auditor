server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # A API fica no mesmo endereço do front: um servidor só para quem usa.
  location /api/ {
    proxy_pass http://api:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # O progresso da coleta chega por SSE: sem buffer e sem tempo limite curto.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Rotas do React Router resolvem no index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
