server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # A API fica no mesmo endereço do front: um servidor só para quem usa. O `^~` faz este prefixo
  # vencer a location de arquivos estáticos abaixo: sem ele, uma rota da API terminada em .js,
  # .css ou .svg seria procurada no disco do nginx. Os cabeçalhos de segurança da API vêm do
  # helmet; repeti-los aqui duplicaria cada um na resposta.
  location ^~ /api/ {
    proxy_pass http://api:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # O progresso da coleta chega por SSE: sem buffer e sem tempo limite curto.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Rotas do React Router resolvem no index.html.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }

  # Um `add_header` dentro de uma location apaga os herdados: por isso os cabeçalhos de segurança
  # entram por include em cada location do front, e não no bloco server.
  location ~* \.(js|css|svg|woff2?)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
